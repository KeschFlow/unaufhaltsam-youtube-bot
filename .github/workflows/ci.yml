name: UNAUFHALTSAM CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q unaufhaltsam_youtube tests
      - name: Run unit tests
        env:
          PUBLISH_MODE: dry_run
        run: python -m unittest discover -s tests -v

  visual-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install browser and OCR
        run: |
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Real visual gameplay dry-run
        env:
          PUBLISH_MODE: dry_run
          BOT_STRATEGY: visual_v1
          RUN_TIMEOUT_SECONDS: 120
          OUTPUT_DIR: output
        run: python autopilot.py --once
      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-dry-run-evidence
          path: output/
          if-no-files-found: warn
